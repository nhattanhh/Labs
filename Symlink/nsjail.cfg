name: "zipzone-nsjail"
description: "Example nsjail configuration for containing a web server."

mode: ONCE
uidmap {inside_id: "1000"}
gidmap {inside_id: "1000"}
mount_proc: true
rlimit_as_type: HARD
rlimit_cpu_type: HARD
rlimit_nofile_type: HARD
rlimit_nproc_type: HARD

time_limit: 0
clone_newnet: false

mount: [
  {
    src: "/chroot"
    dst: "/"
    is_bind: true
  },
  {
    src: "/dev"
    dst: "/dev"
    is_bind: true
  },
  {
    src: "tmpfs"
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
  }
]